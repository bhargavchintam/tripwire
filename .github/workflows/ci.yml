name: ci

# Offline test run: no ClickHouse, AkashML or Guild credentials are needed.
# Tests that need ClickHouse skip themselves when it is not reachable on localhost:8123.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit + integration tests (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Typer forces coloured --help output when GITHUB_ACTIONS is set. That breaks the plain-text
      # flag check in tests/unit/test_detector_loop.py, so keep the output plain, as on a laptop.
      _TYPER_FORCE_DISABLE_TERMINAL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install Python deps from uv.lock
        run: uv sync --locked
      - name: Run the tests (make test)
        run: make test
