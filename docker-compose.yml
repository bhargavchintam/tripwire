services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: tripwire-clickhouse
    ports:
      - "8123:8123"   # HTTP (clickhouse-connect)
      - "9000:9000"   # native
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: tripwire
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - ch-data:/var/lib/clickhouse

volumes:
  ch-data:
